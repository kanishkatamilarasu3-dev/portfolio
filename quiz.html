
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .app-card { max-width: 650px; margin: 30px auto; }
        .option {
            display: block; width: 100%; text-align: left;
            padding: 14px; margin: 10px 0;
            border: 1px solid #d7c8f5; border-radius: 12px;
            background: #fff; cursor: pointer; font-size: 16px;
        }
        .option:hover { background: #f1eaff; }
        .option:disabled { cursor: default; opacity: 1; }
        #feedback { font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>
<header>
    <h1 style="color:white">❓ Quiz Application</h1>
    <p>Test your programming knowledge</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="container">
    <div class="card app-card">
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="options"></div>
        <p id="feedback" aria-live="polite"></p>
        <h3 id="score"></h3>

        <button class="button" id="next" type="button" hidden>
            Next Question →
        </button>

        <button class="button" id="restart" type="button" hidden>
            Restart Quiz ↻
        </button>

        <p><a href="projects.html">← Back to Projects</a></p>
    </div>
</main>

<script>
    const questions = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Tech Modern Language",
                "Home Tool Markup Language",
                "Hyper Transfer Machine Language"
            ],
            answer: 0
        },
        {
            question: "Which language runs in a web browser?",
            options: ["Java", "C", "JavaScript", "SQL"],
            answer: 2
        },
        {
            question: "Which keyword creates a class in Java?",
            options: ["define", "class", "create", "object"],
            answer: 1
        },
        {
            question: "Which CSS property changes text color?",
            options: ["font-style", "background", "text-size", "color"],
            answer: 3
        },
        {
            question: "Which HTML tag creates a link?",
            options: ["<link>", "<a>", "<p>", "<h1>"],
            answer: 1
        }
    ];

    let current = 0;
    let points = 0;
    let answered = false;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next");
    const restartBtn = document.getElementById("restart");
    const scoreEl = document.getElementById("score");

    function showQuestion() {
        answered = false;
        const q = questions[current];

        document.getElementById("progress").textContent =
            "Question " + (current + 1) + " of " + questions.length;

        questionEl.textContent = q.question;
        optionsEl.replaceChildren();
        feedbackEl.textContent = "";
        scoreEl.textContent = "";
        nextBtn.hidden = true;
        restartBtn.hidden = true;

        q.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.className = "option";
            button.type = "button";
            button.textContent = option;
            button.addEventListener("click", () => chooseAnswer(index));
            optionsEl.appendChild(button);
        });
    }

    function chooseAnswer(index) {
        if (answered) return;
        answered = true;

        const correct = index === questions[current].answer;

        if (correct) {
            points++;
            feedbackEl.textContent = "Correct! 🎉";
        } else {
            feedbackEl.textContent =
                "Not quite! The correct answer is: " +
                questions[current].options[questions[current].answer];
        }

        Array.from(optionsEl.children).forEach(button => {
            button.disabled = true;
        });

        if (current < questions.length - 1) {
            nextBtn.hidden = false;
        } else {
            scoreEl.textContent =
                "Final Score: " + points + " / " + questions.length;
            restartBtn.hidden = false;
        }
    }

    nextBtn.addEventListener("click", () => {
        current++;
        showQuestion();
    });

    restartBtn.addEventListener("click", () => {
        current = 0;
        points = 0;
        showQuestion();
    });

    showQuestion();
</script>
</body>
</html>
